services:
  h2-database:
    image: oscarfonts/h2
    container_name: h2-database
    ports:
      - "8082:8082"
    environment:
      - H2_OPTIONS=-tcp -tcpAllowOthers -web -webAllowOthers

  spring-app:
    image: eclipse-temurin:25-jdk
    container_name: spring-oop-app
    ports:
      - "8080:8080"
    depends_on:
      - h2-database
    volumes:
      - .:/app
    working_dir: /app
    command: mvn spring-boot:run
